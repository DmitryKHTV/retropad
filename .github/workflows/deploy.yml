name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/dmitrykhtv/retropad

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            build_args: ''
          - service: frontend
            context: ./frontend
            # NEXT_PUBLIC_* is inlined into the browser bundle at build time, so
            # the API origin has to be known here, not on the server.
            build_args: NEXT_PUBLIC_API_URL=https://api-retropad.dkhomutov.dev
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull the new images and restart the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/retropad
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull backend frontend
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # New containers get new IPs, and nginx resolves upstream names once
            # at startup — without this it serves 502 to a healthy backend.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload
            docker image prune -f

            for i in $(seq 1 30); do
              if curl -fsS -k -o /dev/null \
                --resolve api-retropad.dkhomutov.dev:8443:127.0.0.1 \
                https://api-retropad.dkhomutov.dev:8443/health; then
                echo "health check passed after ${i} attempt(s)"
                exit 0
              fi
              sleep 2
            done
            echo "health check never passed — the stack is not serving"
            docker compose -f docker-compose.prod.yml logs --tail 50 backend
            exit 1
