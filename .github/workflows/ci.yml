name: CI

on:
  pull_request:
  # Pushes to master run this from deploy.yml, which ships only after it passes.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: retropad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d retropad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
        env:
          # prisma.config.ts resolves env("DATABASE_URL") at file load, so every
          # CLI command needs one. Nothing connects here — generate reads the schema.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      - run: npx tsc --noEmit
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run test:e2e
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/retropad_test?schema=public
          JWT_SECRET: ci-access-secret-at-least-32-characters
          JWT_EXPIRES_IN: 15min
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
          JWT_REFRESH_EXPIRES_IN: 30d
          CORS_ORIGIN: http://localhost:3001
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
